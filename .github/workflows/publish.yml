name: Publish private packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version already committed on main
        required: true
        default: 0.1.0-alpha.0
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@yongsk0066"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - name: Verify package versions and registry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-release.mjs
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in artifacts/packages/*.tgz; do
            npm publish "$package" --registry=https://npm.pkg.github.com
          done
